<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slither — you vs 15 trained agents</title>
    <meta name="description" content="Play the same C arena I trained in. You are one snake. Fifteen copies of my RL agent hunt with you.">
    <style>
      :root {
        color-scheme: dark;
        --bg: #061818;
        --ink: #f1f1f1;
        --muted: #8aa;
        --cyan: #00bbbb;
        --red: #bb0000;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.45 ui-sans-serif, system-ui, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 16px 32px;
      }
      header { max-width: 880px; text-align: center; }
      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      h1 span { color: var(--cyan); }
      .lede {
        margin: 0 auto 10px;
        max-width: 42rem;
        color: var(--muted);
      }
      .controls {
        margin: 0 0 16px;
        color: var(--ink);
        font-size: 0.95rem;
      }
      kbd {
        display: inline-block;
        padding: 1px 6px;
        border: 1px solid #345;
        border-radius: 4px;
        background: #0b2424;
        font: 12px/1.6 ui-monospace, monospace;
      }
      canvas.emscripten {
        width: min(1280px, 100%);
        height: auto;
        aspect-ratio: 1280 / 720;
        background: #000;
        border: 1px solid #123;
        border-radius: 6px;
      }
      footer {
        margin-top: 14px;
        max-width: 880px;
        color: var(--muted);
        font-size: 0.85rem;
        text-align: center;
      }
      footer a { color: var(--cyan); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>You vs <span>15 trained agents</span></h1>
        <p class="lede">
          Same C simulator I trained in, running in your browser.
          Cyan is you. Red snakes are copies of one RL policy.
          Eat, cut, don't die. Try to outlast them.
        </p>
        <p class="controls">
          <kbd>A</kbd>/<kbd>D</kbd> or arrows steer
          &nbsp;·&nbsp;
          <kbd>Space</kbd>/<kbd>W</kbd>/click boosts
        </p>
      </header>
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
      <footer>
        Client-side WASM. No server. Weights are a 10.7B-step selfplay checkpoint.
      </footer>
    </div>
    <script>
      var Module = {
        canvas: document.getElementById('canvas'),
        print: function (text) { console.log(text); },
        printErr: function (text) { console.error(text); }
      };
    </script>
    <script async type="text/javascript" src="game.js"></script>
  </body>
</html>
