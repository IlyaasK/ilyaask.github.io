<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slither — you vs 15 trained agents</title>
    <meta name="description" content="Play the same C arena I trained in. You are one snake. Fifteen copies of my RL agent hunt with you.">
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: #061818;
        color: #f1f1f1;
        font: 15px/1.4 ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }
      .bar {
        position: absolute;
        z-index: 2;
        left: 0; right: 0; top: 0;
        padding: 10px 16px 8px;
        background: linear-gradient(to bottom, rgba(6,24,24,0.92), rgba(6,24,24,0));
        pointer-events: none;
      }
      h1 { margin: 0; font-size: 1.05rem; font-weight: 650; }
      h1 span { color: #00bbbb; }
      .hint { margin: 2px 0 0; color: #8aa; font-size: 0.85rem; }
      canvas.emscripten {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #061818;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <h1>You vs <span>15 trained agents</span></h1>
      <p class="hint">Mouse or WASD/arrows aim · space or click boosts · cyan is you</p>
    </div>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <script>
      var Module = {
        canvas: document.getElementById('canvas'),
        print: function (text) { console.log(text); },
        printErr: function (text) { console.error(text); }
      };
    </script>
    <script async type="text/javascript" src="game.js"></script>
  </body>
</html>
