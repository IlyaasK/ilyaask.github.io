# Extensionless blog posts (and any unmatched file) render as HTML.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Type = "text/html; charset=utf-8"

# Specific asset MIME types — declared AFTER the catch-all so they override it.
[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "text/javascript"

[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/*.png"
  [headers.values]
    Content-Type = "image/png"

# Countdown's assets live below a nested path; match that segment explicitly.
[[headers]]
  for = "/countdown/assets/*.css"
  [headers.values]
    Content-Type = "text/css"

[[headers]]
  for = "/countdown/assets/*.js"
  [headers.values]
    Content-Type = "text/javascript"

[[headers]]
  for = "/countdown/mesh.png"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/countdown/wllama.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/*.data"
  [headers.values]
    Content-Type = "application/octet-stream"

[[headers]]
  for = "/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"

[[headers]]
  for = "/resume"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline; filename=\"Ilyaas_Kapadia_Resume_Sept2026.pdf\""

[[redirects]]
  from = "/resume"
  to = "/resume.pdf"
  status = 200
  force = true

[[redirects]]
  from = "/resume/"
  to = "/resume.pdf"
  status = 200
  force = true
