<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space Cadet Pinball — RL agent plays live</title>
<meta name="description" content="A trained PPO agent plays Space Cadet Pinball in your browser. Full engine compiled to WebAssembly.">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #050510; color: #e8e8f0;
    font: 15px/1.4 ui-sans-serif, system-ui, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  canvas#canvas {
    display: block;
    max-width: 100vw; max-height: 100vh;
    image-rendering: pixelated;
    background: #000;
  }
  .bar {
    position: absolute; z-index: 2; left: 0; right: 0; top: 0;
    padding: 10px 16px 8px;
    background: linear-gradient(to bottom, rgba(5,5,16,0.9), rgba(5,5,16,0));
    pointer-events: none;
  }
  h1 { margin: 0; font-size: 1.05rem; font-weight: 650; }
  h1 span { color: #f0b400; }
  .hint { margin: 2px 0 0; color: #889; font-size: 0.85rem; }
  #overlay {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(5,5,16,0.94); cursor: pointer;
  }
  #overlay button {
    font: 600 1rem/1 ui-sans-serif, system-ui;
    padding: 13px 24px;
    border: 1px solid #f0b400; background: transparent;
    color: #f0b400; border-radius: 6px; cursor: pointer;
  }
  #overlay button:hover { background: rgba(240,180,0,0.12); }
  #overlay .small { color: #889; font-size: 0.8rem; max-width: 46ch; text-align: center; }
</style>
</head>
<body>
<div class="bar">
  <h1>Space Cadet <span>Pinball</span> — RL agent</h1>
  <p class="hint">Trained PPO agent, live in WebAssembly</p>
</div>
<div id="stage">
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
</div>
<div id="overlay">
  <button id="start">&#9654; Click to start</button>
  <div class="small">
    Unlocks audio and starts the trained agent. The policy (30-float observation &rarr; 8 actions)
    runs as a tiny MLP in JavaScript; the full game engine is the original C++, compiled to WASM.
  </div>
</div>
<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function (t) { console.log(t); },
    printErr: function (t) { console.error(t); }
  };
</script>
<script async src="SpaceCadetPinball.js"></script>
<script src="agent.js"></script>
</body>
</html>
